services:
  app_blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_blue
    restart: unless-stopped
    environment:
      DEPLOYMENT_SLOT: blue
      RELEASE_VERSION: ${RELEASE_VERSION:-1.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-initial}
      PORT: 8080
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - deployment_network

  app_green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_green
    restart: unless-stopped
    environment:
      DEPLOYMENT_SLOT: green
      RELEASE_VERSION: ${RELEASE_VERSION:-1.1.0}
      COMMIT_SHA: ${COMMIT_SHA:-initial}
      PORT: 8080
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - deployment_network

  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    depends_on:
      - app_blue
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active_upstream.conf:/etc/nginx/conf.d/active_upstream.conf:ro
    networks:
      - deployment_network

networks:
  deployment_network:
    driver: bridge
