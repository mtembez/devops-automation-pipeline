name: DevOps CI/CD Automation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    name: Lint & Static Syntax Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Static Python Syntax Check
        run: |
          python -m py_compile app/main.py
          python -m py_compile tests/*.py

      - name: POSIX Shell Script Syntax Verification
        run: |
          bash -n scripts/*.sh

  unit-and-integration-tests:
    name: Unit & Integration Tests (Coverage >= 85%)
    runs-on: ubuntu-latest
    needs: [ lint-and-syntax ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Pytest Suite with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  container-build-verification:
    name: Docker Container Build & Non-Root Security Verification
    runs-on: ubuntu-latest
    needs: [ lint-and-syntax ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: devops-microservice:latest

  deployment-simulation-and-rollback:
    name: Zero-Downtime Deployment & Automated Rollback Validation
    runs-on: ubuntu-latest
    needs: [ unit-and-integration-tests, container-build-verification ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Validate Health Probe Sentinel
        run: |
          PORT=8080 python app/main.py &
          APP_PID=$!
          sleep 1
          ./scripts/health_probe.sh http://localhost:8080/health/ready 10 1 2
          kill -9 $APP_PID 2>/dev/null || true

      - name: Validate Canary Load Testing
        run: |
          PORT=8080 python app/main.py &
          APP_PID=$!
          sleep 1
          ./scripts/canary.sh http://localhost:8080/api/v1/work 15 0
          kill -9 $APP_PID 2>/dev/null || true

      - name: Validate Automated Rollback Engine
        run: |
          ./scripts/rollback.sh green
          grep -q "server app_green:8080" nginx/active_upstream.conf
          ./scripts/rollback.sh blue
          grep -q "server app_blue:8080" nginx/active_upstream.conf
